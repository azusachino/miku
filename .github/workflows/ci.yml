name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - run: nix develop --command make check
      - run: nix develop --command make check-all-features

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - name: Install frontend dependencies
        run: nix develop --command bun install --frozen-lockfile --cwd miku-web
      - name: Install Chromium and its system libraries
        run: nix develop --command make e2e-install E2E_INSTALL_FLAGS=--with-deps
      # Compile before the specs so the API server starts well inside
      # Playwright's webServer timeout.
      - name: Build the API server
        run: nix develop --command cargo build -p miku
      # GitHub sets CI=true: no test.only, two retries, fail on flaky tests.
      - name: Run Playwright specs
        run: nix develop --command make e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: miku-web/test-results/
          retention-days: 7
