name: CI

# Pull requests and manual runs: a merge to main re-ran the check its pull
# request had just passed. Browser specs stay local (`make e2e`): the owner keeps
# Playwright out of CI. miku_docs/** is never ignored: the gates check it.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - run: nix develop --command make check
      - run: nix develop --command make check-all-features
